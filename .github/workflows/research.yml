name: Research

on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      sources:
        description: Source adapter ids to run, separated by spaces. Empty runs every source.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: research
  cancel-in-progress: true

jobs:
  research:
    name: Collect, score and open a pull request
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Collect, validate, score, report and compare
        id: run
        env:
          SOURCES: ${{ inputs.sources }}
        run: |
          args=()
          for source in $SOURCES; do
            args+=(--source "$source")
          done
          set +e
          pnpm backend run "${args[@]}" \
            --diff-output "$RUNNER_TEMP/changes.md" \
            --guard-report "$RUNNER_TEMP/guards.md" | tee "$RUNNER_TEMP/run.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "exit-code=$code" >> "$GITHUB_OUTPUT"
          # 0: success. 3: an anomaly guard failed; the outputs were still written.
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then
            echo "::error::The backend exited with code $code."
            exit "$code"
          fi
          echo "date=$(node -p "require('./results/index.json').latest")" >> "$GITHUB_OUTPUT"
          if grep -q '^No listing, price or ranking changed\.$' "$RUNNER_TEMP/run.log"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload raw fetched responses
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raw-responses
          path: .cache/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: ignore
      - name: Stop when nothing changed
        if: steps.run.outputs.changed == 'false'
        run: echo "No listing, price or ranking changed. No pull request opened." >> "$GITHUB_STEP_SUMMARY"
      - name: Open a pull request
        if: steps.run.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ steps.run.outputs.date }}
          EXIT_CODE: ${{ steps.run.outputs.exit-code }}
        run: |
          branch="research/$DATE"
          body="$RUNNER_TEMP/body.md"
          : > "$body"
          if [ -f "$RUNNER_TEMP/guards.md" ]; then
            cat "$RUNNER_TEMP/guards.md" >> "$body"
          fi
          if [ -f "$RUNNER_TEMP/changes.md" ]; then
            cat "$RUNNER_TEMP/changes.md" >> "$body"
          else
            echo "First snapshot: there is no earlier snapshot to compare with." >> "$body"
          fi
          printf '\nReview the data before merging. Nothing is published until this is merged.\n' >> "$body"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --force-create "$branch"
          git add data/listings results
          git commit --message "feat(data): add snapshot and results for $DATE"
          git push --force origin "$branch"

          labels=()
          if [ "$EXIT_CODE" -eq 3 ]; then
            gh label create needs-attention --color D93F0B \
              --description "An anomaly guard failed" 2>/dev/null || true
            labels+=(--label needs-attention)
          fi
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr edit "$branch" --body-file "$body" "${labels[@]}"
          else
            gh pr create --base main --head "$branch" \
              --title "feat(data): add snapshot and results for $DATE" \
              --body-file "$body" "${labels[@]}"
          fi

  report-failure:
    name: Open or update the tracking issue
    needs: research
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Record the failed run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Research run failed"
          note="The research workflow failed on $(date -u +%Y-%m-%d). See $RUN_URL"
          number=$(gh issue list --state open --search "in:title \"$title\"" \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$note"
          else
            gh issue create --title "$title" --body "$note"
          fi
